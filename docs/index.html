<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>fe - Ship independently. Compose natively.</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css"
        />
        <link rel="icon" type="image/png" href="favicon.png" />
    </head>
    <body>
        <div id="app"></div>

        <script>
            window.$docsify = {
                name: '<img src="favicon.png" alt="fe logo - two interconnected circles representing microfrontend composition" width="24" height="24" style="vertical-align: middle; margin-right: 8px;">',
                repo: "https://github.com/fe-platform/fe",
                loadSidebar: true,
                alias: {
                    "/.*/_sidebar.md": "/_sidebar.md",
                },
                subMaxLevel: 3,
                auto2top: true,
                search: {
                    maxAge: 86400000,
                    paths: "auto",
                    placeholder: "Search",
                    noData: "No Results!",
                },
                copyCode: {
                    buttonText: "Copy",
                    errorText: "Error",
                    successText: "Copied",
                },
                pagination: {
                    previousText: "Previous",
                    nextText: "Next",
                    crossChapter: true,
                },

            };
        </script>

        <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
        <script type="module">
            import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
            mermaid.initialize({ startOnLoad: false });
            window.mermaid = mermaid;
        </script>
        <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
    </body>
</html>
