<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>fe platform · docs</title>
        <link rel="icon" type="image/svg+xml" href="logo.svg" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="preconnect" href="https://esm.sh" crossorigin />
        <link rel="preload" href="fragments/01-header" as="fetch" />
        <link rel="preload" href="fragments/02-hero" as="fetch" />
        <script type="importmap">
            {
                "imports": {
                    "@fe-platform/syntax-highlighter": "https://esm.sh/jsr/@fe-platform/syntax-highlighter@0.0.7?bundle=true&standalone"
                }
            }
        </script>
        <meta
            name="description"
            content="fe platform: a source-first microfrontend system. Teams publish TypeScript source; the JIT server compiles on demand. Import maps resolve dependencies in the browser at runtime."
        />
        <style>
            :root {
                --bg: #fcfcf9;
                --ink: #0a0a0a;
                --mid: #4a4a48;
                --accent: #4338ca;
                --rule: #d1d1cc;
                --dot: #bdbdb8;
                --card-a: #f59e0b; /* Amber */
                --card-b: #3b82f6; /* Blue */
                --card-c: #10b981; /* Emerald */
                --card-d: #f43f5e; /* Rose */
                --code-bg: #fffcf0;
                --code-text: #222220;
                --code-rule: #f0eee0;
                --header-height: 3.5rem;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a09;
                    --ink: #f5f5f3;
                    --mid: #a1a19a;
                    --accent: #818cf8;
                    --rule: #333330;
                    --dot: #2a2a28;
                    --card-a: #fbbf24;
                    --card-b: #60a5fa;
                    --card-c: #34d399;
                    --card-d: #fb7185;
                    --code-bg: #1a1917;
                    --code-text: #d1d1cc;
                    --code-rule: #262624;
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border: 0;
            }

            body {
                background: var(--bg);
                color: var(--ink);
                font-family: system-ui, sans-serif;
                font-size: 16px;
                scroll-behavior: smooth;
            }

            .layout {
                display: grid;
                grid-template-columns: 220px 1fr;
                max-width: 1200px;
                margin: 0 auto;
                min-height: 70vh;
                scroll-margin-top: var(--header-height);

                &:has(#nav-platform[open]) main {
                    padding: 0;
                }
                &:has(#nav-arch[open]) html-include[href*="03"] {
                    display: block;
                }
                &:has(#nav-product[open]) html-include[href*="04"] {
                    display: block;
                }
                &:has(#nav-platform[open]) html-include[href*="05"] {
                    display: block;
                }
                &:has(#nav-tutorials[open]) html-include[href*="06"] {
                    display: block;
                }
            }

            #mobile-nav {
                position: sticky;
                top: var(--header-height);
                align-self: start;

                &::before {
                    content: "";
                    position: absolute;
                    right: 0;
                    top: 0;
                    bottom: -100vh;
                    width: 1px;
                    background: var(--rule);
                    pointer-events: none;
                }

                > summary {
                    display: none;
                }
                aside {
                    display: block !important;
                    counter-reset: page-counter;
                }
            }

            details[name="page"] {
                counter-increment: page-counter;
                position: relative;
                overflow: hidden;

                > summary {
                    padding: 0;
                    font-size: 0.7rem;
                    font-weight: 700;
                    letter-spacing: 0.12em;
                    text-transform: uppercase;
                    cursor: pointer;
                    border-bottom: 1px solid var(--rule);
                    list-style: none;

                    &::-webkit-details-marker {
                        display: none;
                    }

                    a {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        padding: 1.25rem 1.5rem;
                        min-height: 3rem;
                        color: inherit;
                        text-decoration: none;
                        width: 100%;

                        .label {
                            display: flex;
                            align-items: center;
                            gap: 0.5rem;
                        }
                        .icon {
                            font-size: 1rem;
                            vertical-align: middle;
                        }
                    }

                    &::before {
                        content: "0" counter(page-counter);
                        font-family: monospace;
                        font-size: 7rem;
                        opacity: 0.08;
                        position: absolute;
                        right: 0.5rem;
                        top: -0.5rem;
                        font-weight: 900;
                        pointer-events: none;
                        line-height: 1;
                    }

                    .arr::before {
                        content: "▸";
                    }
                }

                &#nav-arch > summary {
                    a .icon {
                        color: var(--card-c);
                    }
                    &::before {
                        color: var(--card-c);
                        opacity: 0.15;
                    }
                }
                &#nav-product > summary {
                    a .icon {
                        color: var(--card-a);
                    }
                    &::before {
                        color: var(--card-a);
                        opacity: 0.15;
                    }
                }
                &#nav-platform > summary {
                    a .icon {
                        color: var(--card-b);
                    }
                    &::before {
                        color: var(--card-b);
                        opacity: 0.15;
                    }
                }
                &#nav-tutorials > summary {
                    a .icon {
                        color: var(--card-d);
                    }
                    &::before {
                        color: var(--card-d);
                        opacity: 0.15;
                    }
                }

                &[open] > summary {
                    color: var(--accent);
                    border-bottom-color: var(--accent);
                    .arr::before {
                        content: "▾";
                        color: var(--accent);
                    }
                }
            }

            main {
                padding: 2.5rem;
                html-include {
                    display: none;
                }
            }

            .wip {
                border: 2px dashed var(--rule);
                padding: 1.5rem;
                background: rgba(0, 0, 0, 0.02);
                border-radius: 8px;
                position: relative;
                margin: 2rem 0;

                &::before {
                    content: "🚧 WORK IN PROGRESS";
                    position: absolute;
                    top: -0.6rem;
                    left: 1rem;
                    background: var(--bg);
                    padding: 0 0.5rem;
                    font-size: 0.6rem;
                    font-weight: 900;
                    letter-spacing: 0.1em;
                    color: var(--mid);
                }

                h3,
                h4 {
                    margin-top: 0 !important;
                    color: var(--mid) !important;
                }
                ul {
                    margin-bottom: 0 !important;
                    font-size: 0.85rem;
                }
            }

            html-include:not(:defined) {
                display: none;
            }
            html-include {
                width: 100%;
                display: block;
                content-visibility: auto;
                contain-intrinsic-size: 1px 500px;
                transition: opacity 0.2s ease-in;

                &:not([state="loaded"]) {
                    opacity: 0;
                }

                &[href*="header"] {
                    position: sticky;
                    top: 0;
                    z-index: 100;
                    min-height: var(--header-height);
                }
                &[href*="hero"] {
                    min-height: 440px;
                }
                &[href*="architecture"] {
                    min-height: 800px;
                }
                &[href*="product-eng"] {
                    min-height: 600px;
                }
                &[href*="platform-eng"] {
                    min-height: 1000px;
                }
                &[href*="tutorials"] {
                    min-height: 600px;
                }
            }

            @media (max-width: 999px) {
                .layout {
                    display: block;
                }
                #mobile-nav {
                    border-right: none;
                    border-bottom: 1px solid var(--rule);
                    position: static;
                    &::before {
                        display: none;
                    }
                    > summary {
                        display: block;
                        padding: 0.875rem 1.5rem;
                        min-height: 3rem;
                        font-size: 0.7rem;
                        font-weight: 700;
                        letter-spacing: 0.12em;
                        text-transform: uppercase;
                        cursor: pointer;
                        list-style: none;
                        border-bottom: 1px solid var(--rule);
                        &::-webkit-details-marker {
                            display: none;
                        }
                    }
                }
                main {
                    padding: 1.5rem;
                }
                html-include[href*="hero"] {
                    min-height: 800px;
                }
            }
        </style>
        <script type="module">
            import {
                highlight,
                applyTheme,
            } from "@fe-platform/syntax-highlighter";

            // 1. Configure and apply syntax highlighting
            applyTheme({
                keyword: "var(--accent)",
                argument: "var(--card-a)",
                string: "var(--card-c)",
                comment: "var(--mid)",
                "comment-style": "italic",
                type: "var(--card-b)",
                number: "var(--card-a)",
                operator: "var(--mid)",
                function: "var(--accent)",
                property: "var(--card-d)",
                variable: "var(--card-a)",
                boolean: "var(--accent)",
                constant: "var(--card-b)",
            });

            highlight(document);

            // 2. Navigation Synchronization Logic
            function getTarget(root, id) {
                if (!root) return null;
                const el = root.getElementById
                    ? root.getElementById(id)
                    : root.querySelector('[id="' + id + '"]');
                if (el) return el;

                const includes = root.querySelectorAll("html-include");
                for (const inc of includes) {
                    const found = getTarget(inc, id);
                    if (found) return found;
                }
                return null;
            }

            function sync() {
                const hash = window.location.hash;
                if (!hash || hash.length < 2) return;
                const id = hash.slice(1);

                const target = getTarget(document, id);
                if (target && target.tagName === "DETAILS") {
                    let current = target;
                    while (current) {
                        if (current.tagName === "DETAILS") current.open = true;
                        current = current.parentElement;
                    }
                    document.getElementById("main-content").scrollIntoView();
                }
            }

            window.addEventListener("hashchange", sync);

            // 3. Custom Element: html-include
            customElements.define(
                "html-include",
                class extends HTMLElement {
                    connectedCallback() {
                        // If already stitched by the server, just highlight
                        if (this.hasAttribute("server-stitched")) {
                            this.setAttribute("state", "loaded");
                            highlight(this);
                            return;
                        }

                        const href = this.getAttribute("href");
                        if (!href) return;

                        if (this.getAttribute("loading") === "eager") {
                            this._load(href);
                        } else {
                            new IntersectionObserver(
                                (entries, observer) => {
                                    if (entries[0].isIntersecting) {
                                        this._load(href);
                                        observer.disconnect();
                                    }
                                },
                                { rootMargin: "400px" },
                            ).observe(this);
                        }
                    }
                    async _load(href) {
                        try {
                            // Strip .html extension to avoid 308 redirects
                            const url = href.replace(/\.html$/, "");
                            const r = await fetch(url);
                            this.innerHTML = await r.text();
                            this.setAttribute("state", "loaded");
                            highlight(this);
                            if (window.location.hash) {
                                setTimeout(sync, 10);
                            }
                        } catch (err) {
                            console.error(err);
                        }
                    }
                },
            );

            // Initial sync
            sync();
        </script>
    </head>

    <body id="top">
        <html-include
            loading="eager"
            href="fragments/01-header"
        ></html-include>
        <html-include
            loading="eager"
            href="fragments/02-hero"
        ></html-include>

        <div id="main-content" class="layout">
            <details id="mobile-nav" open>
                <summary>▸ menu</summary>
                <aside>
                    <details name="page" id="nav-arch" open>
                        <summary>
                            <a href="#nav-arch"
                                ><span class="label"
                                    ><span class="icon">⎔</span>
                                    Architecture</span
                                >
                                <span class="arr"></span
                            ></a>
                        </summary>
                    </details>
                    <details name="page" id="nav-product">
                        <summary>
                            <a href="#nav-product"
                                ><span class="label"
                                    ><span class="icon">⧉</span> For product
                                    engineers</span
                                >
                                <span class="arr"></span
                            ></a>
                        </summary>
                    </details>
                    <details name="page" id="nav-platform">
                        <summary>
                            <a href="#nav-platform"
                                ><span class="label"
                                    ><span class="icon">۞</span> For platform
                                    engineers</span
                                >
                                <span class="arr"></span
                            ></a>
                        </summary>
                    </details>
                    <details name="page" id="nav-tutorials">
                        <summary>
                            <a href="#nav-tutorials"
                                ><span class="label"
                                    ><span class="icon">✺</span> Tutorials</span
                                >
                                <span class="arr"></span
                            ></a>
                        </summary>
                    </details>
                </aside>
            </details>
            <main>
                <html-include
                    href="fragments/03-architecture"
                ></html-include>
                <html-include
                    href="fragments/04-product-eng"
                ></html-include>
                <html-include
                    href="fragments/05-platform-eng"
                ></html-include>
                <html-include href="fragments/06-tutorials"></html-include>
            </main>
        </div>
    </body>
</html>
