<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>fe platform · docs</title>
        <link rel="icon" type="image/svg+xml" href="logo.svg" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="preconnect" href="https://esm.sh" crossorigin />
        <link rel="preload" href="fragments/header" as="fetch" crossorigin="anonymous" />
        <link rel="preload" href="fragments/hero" as="fetch"  crossorigin="anonymous"/>
        <script type="importmap">
            {
                "imports": {
                    "@feo/fe-syntax-highlighter": "https://esm.sh/jsr/@feo/fe-syntax-highlighter@latest?bundle=true&standalone"
                }
            }
        </script>
        <meta name="description" content="fe platform: a source-first microfrontend system." />
        <link rel="stylesheet" href="style.css" />
        <script type="module">
            function getTarget(root, id) {
                const el = root.querySelector?.('[id="' + id + '"]');
                if (el) return el;
                for (const inc of root.querySelectorAll?.("html-include") || []) {
                    const found = getTarget(inc, id);
                    if (found) return found;
                }
                return null;
            }

            function sync() {
                const id = window.location.hash.slice(1);
                const target = getTarget(document, id);
                if (target && target.tagName === "DETAILS") {
                    let current = target;
                    while (current) { if (current.tagName === "DETAILS") current.open = true; current = current.parentElement; }
                    document.getElementById("main-content")?.scrollIntoView();
                }
            }
            window.addEventListener("hashchange", sync);

            class HTMLInclude extends HTMLElement {
                static _eagerPending = new Set();
                static {
                    if (!document.getElementById('html-include-styles')) {
                        const s = document.createElement('style');
                        s.id = 'html-include-styles';
                        s.textContent = 'html-include:not(:defined){display:none}html-include{display:block;width:100%;content-visibility:auto;contain-intrinsic-size:1px 500px}body{opacity:0;transition:opacity .25s}body.ready{opacity:1}';
                        document.head.appendChild(s);
                    }
                }
                connectedCallback() {
                    const href = this.getAttribute("href");
                    if (!href) return;
                    if (this.getAttribute("loading") === "eager") { if (this.getAttribute("state") !== "loaded") this.constructor._eagerPending.add(this); this._load(href); }
                    else {
                        const rect = this.getBoundingClientRect();
                        if (rect.top < window.innerHeight && rect.bottom > 0) this._load(href);
                        else {
                            this._observer = new IntersectionObserver((entries) => {
                                if (entries[0].isIntersecting) { this._cleanupObserver(); this._load(href); }
                            }, { rootMargin: "400px" });
                            this._observer.observe(this);
                        }
                    }
                }
                _cleanupObserver() { if (this._observer) { this._observer.disconnect(); this._observer = null; } }
                disconnectedCallback() { this._cleanupObserver(); }
                async _load(href) {
                    if (this.getAttribute("state") === "loaded" || this._fetching) return;
                    this._fetching = true;
                    try {
                        const r = await fetch(href.replace(/\.html$/, ""));
                        this.innerHTML = await r.text();
                        this.setAttribute("state", "loaded");
                        if (window.location.hash) setTimeout(sync, 10);
                        if (HTMLInclude._eagerPending.has(this)) {
                            HTMLInclude._eagerPending.delete(this);
                            if (HTMLInclude._eagerPending.size === 0) { document.body.classList.add("ready"); sync(); }
                        }
                    } catch (err) { console.error(err); }
                    finally { this._fetching = false; }
                }
            }

            class FEComponent extends HTMLElement {
                static {
                    if (!document.getElementById('fe-component-styles')) {
                        const s = document.createElement('style');
                        s.id = 'fe-component-styles';
                        s.textContent = 'fe-component{display:none}';
                        document.head.appendChild(s);
                    }
                }
                connectedCallback() {
                    const name = this.getAttribute("name");
                    if (!name) return;
                    this.querySelectorAll("style").forEach((s) => {
                        if (!s.innerHTML.includes(`[data-fe-id="${name}"]`)) {
                            s.innerHTML = s.innerHTML.replace(/([^\r\n,{}]+)(?=[^{}]*\{)/g, (m) => {
                                if (m.trim().startsWith("@") || m.includes(":root")) return m;
                                return m.trim().split(/\s*,\s*/).map(sel => `[data-fe-id="${name}"] ${sel}`).join(", ");
                            });
                        }
                        document.head.appendChild(s);
                    });
                    this.querySelectorAll('link[rel="stylesheet"]').forEach((l) => {
                        document.head.appendChild(l);
                    });
                    this._snapshot = Array.from(this.childNodes).map(n => n.cloneNode(true));
                    this.innerHTML = "";
                }
                get content() {
                    const frag = document.createDocumentFragment();
                    (this._snapshot || []).forEach(n => frag.appendChild(n.cloneNode(true)));
                    return frag;
                }
            }

            class FECode extends HTMLElement {
                async connectedCallback() {
                    const template = this.querySelector("template");
                    const content = template ? template.innerHTML : this.textContent;
                    const pre = document.createElement("pre");
                    pre.className = `lang-${this.getAttribute("lang") || ""}`;
                    pre.textContent = content.trim();
                    this.innerHTML = "";
                    this.appendChild(pre);
                    const { highlight } = await import("@feo/fe-syntax-highlighter");
                    highlight(this);
                }
            }

            class FECompose extends HTMLElement {
                static {
                    if (!document.getElementById('fe-compose-styles')) {
                        const s = document.createElement('style');
                        s.id = 'fe-compose-styles';
                        s.textContent = 'fe-compose{display:contents}';
                        document.head.appendChild(s);
                    }
                }
                connectedCallback() {
                    const name = this.getAttribute("name");
                    const target = document.querySelector(`fe-component[name="${name}"]`);
                    if (!target) return;
                    this.setAttribute("data-fe-id", name);
                    const children = Array.from(this.childNodes);
                    this.innerHTML = "";
                    const content = target.content;
                    const root = content.firstElementChild;
                    if (root) {
                        Array.from(this.attributes).forEach(a => {
                            if (!["name", "data-fe-id", "slot"].includes(a.name)) root.setAttribute(a.name, a.value);
                        });
                    }
                    const slots = content.querySelectorAll("slot");
                    slots.forEach(slot => {
                        const name = slot.getAttribute("name");
                        children.filter(c => name ? (c.getAttribute?.("slot") === name) : !c.getAttribute?.("slot"))
                                .forEach(m => slot.parentNode.insertBefore(m, slot));
                        slot.remove();
                    });
                    this.appendChild(content);
                }
            }

            customElements.define("html-include", HTMLInclude);
            customElements.define("fe-component", FEComponent);
            customElements.define("fe-code", FECode);
            customElements.define("fe-compose", FECompose);
        </script>
    </head>
    <body id="top">
        <fe-component name="ShellLayout">
            <link rel="stylesheet" href="shell-layout.css" />
            <slot name="header"></slot>
            <slot name="hero"></slot>
            <div id="main-content" class="layout">
                <details id="mobile-nav" open>
                    <summary>▸ menu</summary>
                    <aside>
                        <details name="page" id="nav-arch" open>
                            <summary><a href="#nav-arch"><span class="label"><span class="icon">⎔</span> Architecture</span><span class="arr"></span></a></summary>
                        </details>
                        <details name="page" id="nav-product">
                            <summary><a href="#nav-product"><span class="label"><span class="icon">⧉</span> Product</span><span class="arr"></span></a></summary>
                        </details>
                        <details name="page" id="nav-platform">
                            <summary><a href="#nav-platform"><span class="label"><span class="icon">۞</span> Platform</span><span class="arr"></span></a></summary>
                        </details>
                        <details name="page" id="nav-tutorials">
                            <summary><a href="#nav-tutorials"><span class="label"><span class="icon">✺</span> Tutorials</span><span class="arr"></span></a></summary>
                        </details>
                    </aside>
                </details>
                <main>
                    <slot name="architecture"></slot>
                    <slot name="product-eng"></slot>
                    <slot name="platform-eng"></slot>
                    <slot name="tutorials"></slot>
                </main>
            </div>
        </fe-component>

        <fe-compose name="ShellLayout">
            <html-include loading="eager" href="fragments/header" slot="header"></html-include>
            <html-include loading="eager" href="fragments/hero" slot="hero"></html-include>
            <html-include loading="eager" href="fragments/architecture" slot="architecture"></html-include>
            <html-include href="fragments/product-eng" slot="product-eng"></html-include>
            <html-include href="fragments/platform-eng" slot="platform-eng"></html-include>
            <html-include href="fragments/tutorials" slot="tutorials"></html-include>
        </fe-compose>
    </body>
</html>
