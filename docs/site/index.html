<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>fe platform · docs</title>
        <link rel="icon" type="image/svg+xml" href="logo.svg" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link rel="preconnect" href="https://esm.sh" crossorigin />
        <link rel="preload" href="fragments/header" as="fetch" crossorigin="anonymous" />
        <link rel="preload" href="fragments/hero" as="fetch"  crossorigin="anonymous"/>
        <script type="importmap">
            {
                "imports": {
                    "@fe-platform/syntax-highlighter": "https://esm.sh/jsr/@fe-platform/syntax-highlighter@latest?bundle=true&standalone"
                }
            }
        </script>
        <meta name="description" content="fe platform: a source-first microfrontend system." />
        <style id="root-styles">
            :root {
                --bg: #fcfcf9; --ink: #0a0a0a; --mid: #4a4a48; --accent: #4338ca; --rule: #d1d1cc; --dot: #bdbdb8;
                --card-a: #f59e0b; --card-b: #3b82f6; --card-c: #10b981; --card-d: #f43f5e;
                --code-bg: #fffcf0; --code-text: #222220; --code-rule: #f0eee0;
                --article-bg: #f8f8f6; --article-text: #1a1a1a; --header-height: 3.5rem;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a09; --ink: #f5f5f3; --mid: #a1a19a; --accent: #818cf8; --rule: #333330; --dot: #2a2a28;
                    --card-a: #fbbf24; --card-b: #60a5fa; --card-c: #34d399; --card-d: #fb7185;
                    --code-bg: #1a1917; --code-text: #d1d1cc; --code-rule: #262624;
                    --article-bg: #141413; --article-text: #e8e8e6;
                }
            }
            body { background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; margin: 0; opacity: 0; transition: opacity 0.25s; }
            body.ready { opacity: 1; }
            fe-component { display: none; }
            fe-compose { display: contents; }

            .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        </style>
        <script type="module">
            function getTarget(root, id) {
                const el = root.querySelector?.('[id="' + id + '"]');
                if (el) return el;
                for (const inc of root.querySelectorAll?.("html-include") || []) {
                    const found = getTarget(inc, id);
                    if (found) return found;
                }
                return null;
            }

            function sync() {
                const id = window.location.hash.slice(1);
                const target = getTarget(document, id);
                if (target && target.tagName === "DETAILS") {
                    let current = target;
                    while (current) { if (current.tagName === "DETAILS") current.open = true; current = current.parentElement; }
                    document.getElementById("main-content")?.scrollIntoView();
                }
            }
            window.addEventListener("hashchange", sync);

            class HTMLInclude extends HTMLElement {
                static _eagerPending = new Set();
                connectedCallback() {
                    const href = this.getAttribute("href");
                    if (!href) return;
                    if (this.getAttribute("loading") === "eager") { if (this.getAttribute("state") !== "loaded") this.constructor._eagerPending.add(this); this._load(href); }
                    else {
                        const rect = this.getBoundingClientRect();
                        if (rect.top < window.innerHeight && rect.bottom > 0) this._load(href);
                        else {
                            this._observer = new IntersectionObserver((entries) => {
                                if (entries[0].isIntersecting) { this._cleanupObserver(); this._load(href); }
                            }, { rootMargin: "400px" });
                            this._observer.observe(this);
                        }
                    }
                }
                _cleanupObserver() { if (this._observer) { this._observer.disconnect(); this._observer = null; } }
                disconnectedCallback() { this._cleanupObserver(); }
                async _load(href) {
                    if (this.getAttribute("state") === "loaded" || this._fetching) return;
                    this._fetching = true;
                    try {
                        const r = await fetch(href.replace(/\.html$/, ""));
                        this.innerHTML = await r.text();
                        this.setAttribute("state", "loaded");
                        if (window.location.hash) setTimeout(sync, 10);
                        if (HTMLInclude._eagerPending.has(this)) {
                            HTMLInclude._eagerPending.delete(this);
                            if (HTMLInclude._eagerPending.size === 0) { document.body.classList.add("ready"); sync(); }
                        }
                    } catch (err) { console.error(err); }
                    finally { this._fetching = false; }
                }
            }

            class FEComponent extends HTMLElement {
                connectedCallback() {
                    const name = this.getAttribute("name");
                    if (!name) return;
                    this.querySelectorAll("style").forEach((s) => {
                        if (!s.innerHTML.includes(`[data-fe-id="${name}"]`)) {
                            s.innerHTML = s.innerHTML.replace(/([^\r\n,{}]+)(?=[^{}]*\{)/g, (m) => {
                                if (m.trim().startsWith("@") || m.includes(":root")) return m;
                                return m.trim().split(/\s*,\s*/).map(sel => `[data-fe-id="${name}"] ${sel}`).join(", ");
                            });
                        }
                        document.head.appendChild(s);
                    });
                    this._snapshot = Array.from(this.childNodes).map(n => n.cloneNode(true));
                    this.innerHTML = "";
                }
                get content() {
                    const frag = document.createDocumentFragment();
                    (this._snapshot || []).forEach(n => frag.appendChild(n.cloneNode(true)));
                    return frag;
                }
            }

            class FECode extends HTMLElement {
                async connectedCallback() {
                    const template = this.querySelector("template");
                    const content = template ? template.innerHTML : this.textContent;
                    const pre = document.createElement("pre");
                    pre.className = `lang-${this.getAttribute("lang") || ""}`;
                    pre.textContent = content.trim();
                    this.innerHTML = "";
                    this.appendChild(pre);
                    const { highlight } = await import("@fe-platform/syntax-highlighter");
                    highlight(this);
                }
            }

            class FECompose extends HTMLElement {
                connectedCallback() {
                    const name = this.getAttribute("name");
                    const target = document.querySelector(`fe-component[name="${name}"]`);
                    if (!target) return;
                    this.setAttribute("data-fe-id", name);
                    const children = Array.from(this.childNodes);
                    this.innerHTML = "";
                    const content = target.content;
                    const root = content.firstElementChild;
                    if (root) {
                        Array.from(this.attributes).forEach(a => {
                            if (!["name", "data-fe-id", "slot"].includes(a.name)) root.setAttribute(a.name, a.value);
                        });
                    }
                    const slots = content.querySelectorAll("slot");
                    slots.forEach(slot => {
                        const name = slot.getAttribute("name");
                        children.filter(c => name ? (c.getAttribute?.("slot") === name) : !c.getAttribute?.("slot"))
                                .forEach(m => slot.parentNode.insertBefore(m, slot));
                        slot.remove();
                    });
                    this.appendChild(content);
                }
            }

            customElements.define("html-include", HTMLInclude);
            customElements.define("fe-component", FEComponent);
            customElements.define("fe-code", FECode);
            customElements.define("fe-compose", FECompose);
        </script>
    </head>
    <body id="top">
        <fe-component name="ShellLayout">
            <style>
                .layout { display: grid; grid-template-columns: 220px 1fr; max-width: 1200px; margin: 0 auto; min-height: 70vh; scroll-margin-top: var(--header-height); }
                .layout:has(#nav-platform[open]) main { padding: 0; }
                .layout:has(#nav-arch[open]) html-include[href*="architecture"],
                .layout:has(#nav-product[open]) html-include[href*="product-eng"],
                .layout:has(#nav-platform[open]) html-include[href*="platform-eng"],
                .layout:has(#nav-tutorials[open]) html-include[href*="tutorials"] { display: block; }

                #mobile-nav { position: sticky; top: var(--header-height); align-self: start; }
                #mobile-nav::before { content: ""; position: absolute; right: 0; top: 0; bottom: -100vh; width: 1px; background: var(--rule); pointer-events: none; }
                #mobile-nav > summary { display: none; }
                #mobile-nav aside { display: block !important; counter-reset: page-counter; }

                details[name="page"] { counter-increment: page-counter; position: relative; overflow: hidden; display: block; }
                details[name="page"] > summary { padding: 0; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; border-bottom: 1px solid var(--rule); list-style: none; }
                details[name="page"] > summary::-webkit-details-marker { display: none; }
                details[name="page"] > summary a { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; color: inherit; text-decoration: none; width: 100%; }
                details[name="page"] > summary a .label { display: flex; align-items: center; gap: 0.5rem; }
                details[name="page"] > summary a .icon { font-size: 1rem; vertical-align: middle; }
                details[name="page"] > summary::before { content: "0" counter(page-counter); font-family: monospace; font-size: 7rem; opacity: 0.08; position: absolute; right: 0.5rem; top: -0.5rem; font-weight: 900; pointer-events: none; line-height: 1; }
                details[name="page"] > summary .arr::before { content: "▸"; }

                #nav-arch > summary a .icon { color: var(--card-c); } #nav-arch > summary::before { color: var(--card-c); opacity: 0.15; }
                #nav-product > summary a .icon { color: var(--card-a); } #nav-product > summary::before { color: var(--card-a); opacity: 0.15; }
                #nav-platform > summary a .icon { color: var(--card-b); } #nav-platform > summary::before { color: var(--card-b); opacity: 0.15; }
                #nav-tutorials > summary a .icon { color: var(--card-d); } #nav-tutorials > summary::before { color: var(--card-d); opacity: 0.15; }

                details[name="page"][open] > summary { color: var(--accent); border-bottom-color: var(--accent); }
                details[name="page"][open] > summary .arr::before { content: "▾"; color: var(--accent); }

                main { padding: 2.5rem; }
                main html-include { display: none; }

                article section { background: var(--article-bg); color: var(--article-text); }
                article h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 0.06em; }
                article h3 { font-size: 0.8rem; font-weight: 700; margin: 1.75rem 0 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
                article p { font-size: 1rem; line-height: 1.65; margin-bottom: 1rem; }
                article ul, article ol { padding-left: 1.5rem; margin-bottom: 1rem; }
                article li { font-size: 1rem; line-height: 1.65; margin-bottom: 0.2rem; }
                article pre { background: var(--code-bg); color: var(--code-text); padding: 1.25rem; font-size: 85%; line-height: 1.55; overflow-x: auto; margin: 1rem 0; border: 1px solid var(--code-rule, transparent); border-radius: 4px; max-width: 100%; }
                article :not(pre) > code { background: rgba(0, 0, 0, 0.07); padding: 0.1em 0.35em; font-size: 85%; font-family: monospace; }
                article table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 1rem 0; }
                article th { text-align: left; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.68rem; padding: 0.6rem; border-bottom: 2px solid var(--ink); }
                article td { padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.5; }

                .wip { border: 2px dashed var(--rule); padding: 1.5rem; background: rgba(0, 0, 0, 0.02); border-radius: 8px; position: relative; margin: 2rem 0; }
                .wip::before { content: "🚧 WORK IN PROGRESS"; position: absolute; top: -0.6rem; left: 1rem; background: var(--bg); padding: 0 0.5rem; font-size: 0.6rem; font-weight: 900; letter-spacing: 0.1em; color: var(--mid); }
                .wip h3, .wip h4 { margin-top: 0 !important; color: var(--mid) !important; }
                .wip ul { margin-bottom: 0 !important; font-size: 0.85rem; }

                html-include:not(:defined) { display: none; }
                html-include { width: 100%; display: block; content-visibility: auto; contain-intrinsic-size: 1px 500px; }
                html-include[href*="header"] { position: sticky; top: 0; z-index: 100; min-height: 3.5rem; }
                html-include[href*="hero"] { min-height: 440px; }
                @media (max-width: 999px) {
                    .layout { display: block; }
                    html-include[href*="hero"] { min-height: 800px; }
                    #mobile-nav { border-right: none; border-bottom: 1px solid var(--rule); position: static; }
                    #mobile-nav::before { display: none; }
                    #mobile-nav > summary { display: block; padding: 0.875rem 1.5rem; min-height: 3rem; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; list-style: none; border-bottom: 1px solid var(--rule); }
                    #mobile-nav > summary::-webkit-details-marker { display: none; }
                    main { padding: 1.5rem; }
                }
            </style>
            <slot name="header"></slot>
            <slot name="hero"></slot>
            <div id="main-content" class="layout">
                <details id="mobile-nav" open>
                    <summary>▸ menu</summary>
                    <aside>
                        <details name="page" id="nav-arch" open>
                            <summary><a href="#nav-arch"><span class="label"><span class="icon">⎔</span> Architecture</span><span class="arr"></span></a></summary>
                        </details>
                        <details name="page" id="nav-product">
                            <summary><a href="#nav-product"><span class="label"><span class="icon">⧉</span> Product</span><span class="arr"></span></a></summary>
                        </details>
                        <details name="page" id="nav-platform">
                            <summary><a href="#nav-platform"><span class="label"><span class="icon">۞</span> Platform</span><span class="arr"></span></a></summary>
                        </details>
                        <details name="page" id="nav-tutorials">
                            <summary><a href="#nav-tutorials"><span class="label"><span class="icon">✺</span> Tutorials</span><span class="arr"></span></a></summary>
                        </details>
                    </aside>
                </details>
                <main>
                    <slot name="architecture"></slot>
                    <slot name="product-eng"></slot>
                    <slot name="platform-eng"></slot>
                    <slot name="tutorials"></slot>
                </main>
            </div>
        </fe-component>

        <fe-compose name="ShellLayout">
            <html-include loading="eager" href="fragments/header" slot="header"></html-include>
            <html-include loading="eager" href="fragments/hero" slot="hero"></html-include>
            <html-include loading="eager" href="fragments/architecture" slot="architecture"></html-include>
            <html-include href="fragments/product-eng" slot="product-eng"></html-include>
            <html-include href="fragments/platform-eng" slot="platform-eng"></html-include>
            <html-include href="fragments/tutorials" slot="tutorials"></html-include>
        </fe-compose>
    </body>
</html>
