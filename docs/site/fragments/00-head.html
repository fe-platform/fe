<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fe platform · docs</title>
<style>
:root {
  --bg: #f4f3ef; --ink: #111111; --mid: #888880;
  --accent: #3535aa; --rule: #d0cfc8; --dot: #c8c7c0;
  --card-a: #e8e4d4; --card-b: #d4dce8; --card-c: #d4e8d8; --card-d: #e8d4d4;
  --code-bg: #111111; --code-text: #f4f3ef;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
.dot-grid {
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
  --dot-step: 20px; background-size: var(--dot-step) var(--dot-step);
}
.dot-grid.dense { --dot-step: 12px; }
.site-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.875rem 2rem; border-bottom: 1px solid var(--rule);
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
}
.site-header .version { color: var(--mid); font-weight: 400; }
.site-title { display: flex; align-items: center; gap: 0.6rem; }
.site-title svg { width: 26px; height: 26px; flex-shrink: 0; }
.hero { border-bottom: 1px solid var(--rule); }
.hero-inner { display: grid; grid-template-columns: 1fr 1fr; max-width: 1000px; margin: 0 auto; }
.hero-left { padding: 2rem; border-right: 1px solid var(--rule); }
.hero-left h1 { font-size: 2.25rem; line-height: 1.15; margin-bottom: 1rem; }
.hero-left h1 .light { font-weight: 300; display: block; }
.hero-left h1 strong { font-weight: 900; }
.hero-intro { font-size: 0.875rem; line-height: 1.65; color: var(--ink); margin-bottom: 1.5rem; }
.diagram { border: 1px solid var(--ink); margin-top: 1.25rem; }
.diagram-grid { display: grid; grid-template-columns: 1fr 1fr; }
.diagram-cell {
  padding: 1rem 1.25rem; font-size: 0.68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--rule);
}
.diagram-cell .sub {
  font-weight: 400; font-size: 0.62rem; color: var(--ink);
  margin-top: 0.2rem; text-transform: none; letter-spacing: 0;
}
.hero-right { padding: 2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; align-content: start; background: var(--bg); }
.card { border: 1px solid var(--rule); padding: 1.25rem; text-decoration: none; color: var(--ink); display: block; }
.card:hover { border-color: var(--accent); }
.card-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.4rem; }
.card-desc { font-size: 0.78rem; color: var(--mid); line-height: 1.4; }
.card-a { background: var(--card-a); } .card-b { background: var(--card-b); }
.card-c { background: var(--card-c); } .card-d { background: var(--card-d); }
.layout {
  display: grid; grid-template-columns: 220px 1fr;
  max-width: 1000px; margin: 0 auto; min-height: 70vh;
}
#mobile-nav { border-right: 1px solid var(--rule); }
#mobile-nav > summary { display: none; }
#mobile-nav > aside { display: block !important; }
aside { counter-reset: page-counter; }
details[name="page"] { counter-increment: page-counter; position: relative; overflow: hidden; }
details[name="page"] > summary {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1.25rem 1.5rem; font-size: 0.7rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
  border-bottom: 1px solid var(--rule); list-style: none;
}
details[name="page"] > summary::-webkit-details-marker { display: none; }
details[name="page"][open] > summary { color: var(--accent); border-bottom-color: var(--accent); }
details[name="page"] > summary::before {
  content: "0" counter(page-counter);
  font-size: 7rem; opacity: 0.06; position: absolute;
  right: 0.5rem; top: -0.5rem; font-weight: 900; pointer-events: none; line-height: 1;
}
details[name="page"] > summary .arr::before { content: "▸"; }
details[name="page"][open] > summary .arr::before { content: "▾"; color: var(--accent); }
main > article { display: none; padding: 2.5rem; }
.layout:has(#nav-arch[open])     #content-arch     { display: block; }
.layout:has(#nav-product[open])  #content-product  { display: block; }
.layout:has(#nav-platform[open]) #content-platform { display: block; }
.layout:has(#nav-tutorials[open])#content-tutorials { display: block; }
.layout:has(#nav-platform[open]) #content-platform {
  display: grid; grid-template-columns: 140px 1fr; padding: 0;
}
.sub-nav { border-right: 1px solid var(--rule); padding: 0.75rem 0; }
details[name="plat-sub"] > summary {
  display: block; padding: 0.65rem 1.25rem; font-size: 0.65rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
  list-style: none; color: var(--mid);
}
details[name="plat-sub"] > summary::-webkit-details-marker { display: none; }
details[name="plat-sub"][open] > summary { color: var(--accent); }
#content-platform > section { display: none; padding: 2rem; }
#content-platform:has(#nav-poc[open])        #content-poc        { display: block; }
#content-platform:has(#nav-cloud[open])      #content-cloud      { display: block; }
#content-platform:has(#nav-enterprise[open]) #content-enterprise { display: block; }
h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 0.06em; }
h3 { font-size: 0.8rem; font-weight: 700; margin: 1.75rem 0 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
p { font-size: 0.875rem; line-height: 1.65; margin-bottom: 1rem; }
ul, ol { padding-left: 1.5rem; margin-bottom: 1rem; }
li { font-size: 0.875rem; line-height: 1.65; margin-bottom: 0.2rem; }
pre {
  background: var(--code-bg); color: var(--code-text); padding: 1.25rem;
  font-size: 0.78rem; line-height: 1.55; overflow-x: auto; margin: 1rem 0;
}
:not(pre) > code { background: rgba(0,0,0,0.07); padding: 0.1em 0.35em; font-size: 0.85em; font-family: monospace; }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin: 1rem 0; }
th {
  text-align: left; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; font-size: 0.68rem; padding: 0.6rem;
  border-bottom: 2px solid var(--ink);
}
td { padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.5; }
.lifecycle { display: flex; flex-wrap: wrap; border: 1px solid var(--ink); margin: 1.5rem 0; }
.lc-step { padding: 0.75rem 1rem; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; border-right: 1px solid var(--rule); flex: 1; }
.lc-step:last-child { border-right: none; }
.lc-step .sub { font-weight: 400; font-size: 0.62rem; color: var(--mid); text-transform: none; margin-top: 0.2rem; }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131311; --ink: #e4e3df; --mid: #6a6a62;
    --accent: #7878e0; --rule: #2e2e2b; --dot: #1f1f1c;
    --code-bg: #1c1c1a; --code-text: #e4e3df;
    --card-a: #1e1b14; --card-b: #131720; --card-c: #131b15; --card-d: #1e1414;
  }
  :not(pre) > code { background: rgba(255,255,255,0.09); }
}
@media (max-width: 999px) {
  .layout { display: block; }
  #mobile-nav { border-right: none; border-bottom: 1px solid var(--rule); }
  #mobile-nav > summary {
    display: block; padding: 0.875rem 1.5rem; font-size: 0.7rem;
    font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; list-style: none; border-bottom: 1px solid var(--rule);
  }
  #mobile-nav > summary::-webkit-details-marker { display: none; }
  .hero-inner { grid-template-columns: 1fr; }
  .hero-left { border-right: none; border-bottom: 1px solid var(--rule); }
  main > article { padding: 1.5rem; }
  .layout:has(#nav-platform[open]) #content-platform { grid-template-columns: 1fr; }
  .sub-nav { border-right: none; border-bottom: 1px solid var(--rule); }
}
</style>
</head>
<body>
